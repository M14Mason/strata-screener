# Builds the end-of-day dataset the hosted app serves from, each weekday
# evening, and publishes it as a release asset.
#
# No secrets required: the default source is Nasdaq's public historical-prices
# endpoint, which needs no API key. Set a POLYGON_API_KEY secret and switch the
# source input to "polygon" if you have a key and want the cheaper grouped feed.
#
# The dataset is deliberately not committed: it is tens of megabytes and is
# rewritten daily, so committing it would grow the repository without bound.
# Publishing it as a release asset keeps the repo small and gives the app's
# build a stable URL to pull from.
name: Build EOD dataset

on:
  schedule:
    # 22:15 UTC on weekdays — after the 16:00 ET close, allowing for DST.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      sessions:
        description: "Trading days of history to include"
        default: "320"
      max_symbols:
        description: "Cap on symbols (0 = every listing)"
        default: "2000"
      source:
        description: "nasdaq (no key) or polygon (needs POLYGON_API_KEY)"
        default: "nasdaq"
      delay:
        description: "Milliseconds between requests per worker"
        default: "700"

permissions:
  contents: write

concurrency:
  group: eod-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Nasdaq's endpoint blocks an IP that requests too fast, so the build is
    # paced. A full run is hours, not minutes, and that is expected.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Per-symbol bars are cached between runs, so a daily rebuild only has to
      # fetch what changed rather than the whole universe again.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/nasdaq-bars
            .cache/grouped
          key: eod-prices-${{ github.run_id }}
          restore-keys: eod-prices-

      - name: Build dataset
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_RATE_LIMIT: ${{ vars.POLYGON_RATE_LIMIT || '5' }}
        run: |
          npx tsx --conditions react-server scripts/build-bundle.mts \
            --source "${{ github.event.inputs.source || 'nasdaq' }}" \
            --sessions "${{ github.event.inputs.sessions || '320' }}" \
            --max-symbols "${{ github.event.inputs.max_symbols || '2000' }}" \
            --concurrency 1 \
            --delay "${{ github.event.inputs.delay || '700' }}"

      # A silently corrupt or stale dataset would be worse than none at all, so
      # publication is gated on it reading back correctly.
      - name: Verify the dataset
        run: npx tsx --conditions react-server scripts/bundle-verify.mts

      - name: Publish as the rolling data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete data-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create data-latest data/eod-bundle.bin \
            --title "Latest EOD dataset" \
            --notes "Built $(date -u +'%Y-%m-%d %H:%M UTC'). Consumed at build time via EOD_BUNDLE_URL."

      # Redeploy so the running site picks up today's data.
      #
      # The check lives in the script rather than an `if:` because the `secrets`
      # context is not available in step conditions -- referencing it there is a
      # workflow-file error, not a false condition.
      - name: Trigger host redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering redeploy hook…"
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          else
            echo "No DEPLOY_HOOK_URL secret set — skipping redeploy."
          fi
