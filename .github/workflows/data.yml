# Builds the end-of-day dataset the hosted app serves from, once per weekday
# evening, and publishes it as a release asset.
#
# The dataset is deliberately not committed: it is tens of megabytes and is
# rewritten daily, so committing it would grow the repository without bound.
# Publishing it as a release asset keeps the repo small and gives the build a
# stable URL to pull from.
#
# Requires a repository secret POLYGON_API_KEY (free tier is enough).
name: Build EOD dataset

on:
  schedule:
    # 22:15 UTC on weekdays — after the 16:00 ET close, allowing for DST.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      sessions:
        description: "Trading days of history to include"
        default: "320"
      max_symbols:
        description: "Cap on symbols (0 = every listing)"
        default: "2500"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Past sessions never change, so the per-day responses are cached between
      # runs. A daily run then costs one new API request instead of ~320.
      - name: Restore session cache
        uses: actions/cache@v4
        with:
          path: .cache/grouped
          key: polygon-grouped-${{ github.run_id }}
          restore-keys: polygon-grouped-

      - name: Build dataset
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_RATE_LIMIT: ${{ vars.POLYGON_RATE_LIMIT || '5' }}
        run: |
          npx tsx scripts/build-bundle.mts \
            --sessions ${{ github.event.inputs.sessions || '320' }} \
            --max-symbols ${{ github.event.inputs.max_symbols || '2500' }}

      - name: Verify the dataset reads back
        run: npx tsx --conditions react-server scripts/bundle-verify.mts

      - name: Publish as the rolling data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete data-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create data-latest data/eod-bundle.bin \
            --title "Latest EOD dataset" \
            --notes "Built $(date -u +'%Y-%m-%d %H:%M UTC'). Consumed at build time via EOD_BUNDLE_URL."

      # Redeploy so the running site picks up today's data.
      #
      # The check lives in the script rather than an `if:` because the `secrets`
      # context is not available in step conditions -- referencing it there is a
      # workflow-file error, not a false condition.
      - name: Trigger host redeploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering redeploy hook…"
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          else
            echo "No DEPLOY_HOOK_URL secret set — skipping redeploy."
          fi
