name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Engine tests
        run: npm test
      - name: Dataset format tests
        run: npm run test:bundle
      - name: Indicators vs. real market data
        run: npm run test:real
      # Skips itself when no dataset is installed, which is the usual case on a
      # pull request; the nightly data job runs it before publishing.
      - name: Screener correctness
        run: npm run test:screener
      - name: Production build
        run: npm run build
